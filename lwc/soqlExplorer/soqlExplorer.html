<template>
    <lightning-card icon-name='utility:summary'>
        <span slot="title">Salesforce Query Utility Tool</span>

        <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
            <lightning-button-menu icon-name="utility:clock" icon-position="left" label="Recent Queries"
                onselect={handleHistorySelect} class="slds-m-right_small">
                <template if:true={recentQueries.length}>
                    <div class="menu-header-compact slds-border_bottom slds-grid slds-grid_align-center slds-p-vertical_xx-small">
                        <button class="slds-button slds-button_neutral custom-mini-btn" onclick={handleClearAll}>
                            <lightning-icon 
                                icon-name="utility:delete" 
                                size="xx-small" 
                                class="slds-m-right_xxx-small custom-icon-red">
                            </lightning-icon>
                            <span>Clear All</span>
                        </button>
                    </div>
                </template>
                <template for:each={recentQueries} for:item="q">
                    <lightning-menu-item key={q} label={q} value={q} title={q}></lightning-menu-item>
                </template>
                <template if:false={recentQueries.length}>
                    <lightning-menu-item label="No recent history" disabled></lightning-menu-item>
                </template>
            </lightning-button-menu>

            <lightning-button-menu icon-name="utility:favorite" icon-position="left" label="Saved Queries"
                onselect={handleSavedSelect} menu-alignment="right">
                <template for:each={savedQueries} for:item="sq">
                    <div key={sq}
                        class="slds-grid slds-grid_vertical-align-center slds-p-horizontal_x-small dropdown-item-wrapper"
                        style="width: 100%;">
                        <lightning-menu-item label={sq} value={sq} title={sq} class="slds-col"></lightning-menu-item>
                        <lightning-button-icon icon-name="utility:delete" variant="bare" onclick={handleDeleteSaved}
                            data-query={sq} alternative-text="Delete" title="Delete"
                            class="red-icon slds-m-left_x-small">
                        </lightning-button-icon>
                    </div>
                </template>
                <template if:false={savedQueries.length}>
                    <lightning-menu-item label="No saved queries" disabled></lightning-menu-item>
                </template>
            </lightning-button-menu>
        </div>
        <div class="slds-p-around_medium">
            <lightning-input type="search" label="Search Object" placeholder="Type object name..."
                value={objectSearchKey} onchange={handleObjectSearch} onclick={handleInputClick}>
            </lightning-input>

            <template if:true={showObjectSearchResults}>
                <div class="slds-box slds-m-top_x-small slds-scrollable_y" style="max-height: 200px">
                    <template for:each={filteredObjects} for:item="obj">
                        <div key={obj.apiName}
                            class="slds-p-around_x-small slds-border_bottom slds-truncate slds-text-link"
                            style="cursor: pointer;" onclick={selectObject} data-api={obj.apiName}>
                            {obj.label} ({obj.apiName})
                        </div>
                    </template>
                </div>
            </template>

            <template if:true={isObjectSelected}>
                <div class="slds-m-top_medium slds-box slds-theme_shade">
                    
                    <div class="slds-grid slds-grid_vertical-align-center slds-p-bottom_small slds-border_bottom">
                        <lightning-button-icon 
                            icon-name="utility:back" 
                            variant="border-filled" 
                            alternative-text="Back" 
                            onclick={handleNavigateBack} 
                            disabled={isRootLevel}
                            class="slds-m-right_small">
                        </lightning-button-icon>
                        <div class="slds-text-title_bold slds-truncate">
                            Path: <span class="slds-text-color_success">{navigationPathString}</span>
                        </div>
                    </div>

                    <div class="slds-grid slds-gutters slds-m-top_small">
    
                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-m-bottom_small">
                                <lightning-input 
                                    type="search" 
                                    variant="label-hidden" 
                                    placeholder="Search available fields..." 
                                    value={fieldSearchTerm} 
                                    onchange={handleFieldSearchChange}
                                    class="search-field-input-stretched">
                                </lightning-input>
                            </div>
                            
                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_xx-small inline-header-container">
                                <span class="slds-form-element__label slds-no-margin title-label-restored">
                                    Available Fields ({currentObjectName})
                                </span>
                                <div class="custom-checkbox-row">
                                    <label class="micro-checkbox-lbl">
                                        <input type="checkbox" checked={isSelectAllChecked} onchange={handleSelectAllChange} class="raw-cb"/>
                                        <span>All</span>
                                    </label>
                                    <label class="micro-checkbox-lbl">
                                        <input type="checkbox" checked={isSelectStandardChecked} onchange={handleSelectStandardChange} class="raw-cb"/>
                                        <span>Standard</span>
                                    </label>
                                    <label class="micro-checkbox-lbl">
                                        <input type="checkbox" checked={isSelectCustomChecked} onchange={handleSelectCustomChange} class="raw-cb"/>
                                        <span>Custom</span>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="slds-box slds-scrollable_y" style="height: 250px; background: #fff; padding: 0;">
                                <template if:true={isFieldsLoading}>
                                    <div class="slds-align_absolute-center" style="height:100%;">
                                        <lightning-spinner alternative-text="Loading fields..." size="small"></lightning-spinner>
                                    </div>
                                </template>
                                <template if:false={isFieldsLoading}>
                                    <ul class="slds-has-dividers_bottom-space">
                                        <template for:each={filteredAvailableFields} for:item="fld">
                                            <li key={fld.fullPath} class={fld.rowClass}>
                                                <div class="slds-col slds-truncate slds-p-left_x-small select-clickable-field" 
                                                    onclick={handleSelectField} 
                                                    data-field-path={fld.fullPath}
                                                    data-api={fld.apiName}
                                                    title={fld.fullPath}
                                                    style="cursor: pointer; width: 100%;">
                                                    {fld.label} <span class="slds-text-color_weak slds-font-size_small">({fld.apiName})</span>
                                                </div>
                                                
                                                <template if:true={fld.isLookup}>
                                                    <div class="slds-col_auto">
                                                        <lightning-button-icon 
                                                            icon-name="utility:chevronright" 
                                                            variant="border-filled" 
                                                            alternative-text="Drill down"
                                                            title={fld.label}
                                                            onclick={handleDrillDown}
                                                            data-api={fld.apiName}
                                                            data-relationship={fld.relationshipName}
                                                            data-parent={fld.referenceTo}
                                                            disabled={isMaxDepthReached}>
                                                        </lightning-button-icon>
                                                    </div>
                                                </template>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="slds-m-bottom_small">
                                <lightning-input 
                                    type="search" 
                                    variant="label-hidden" 
                                    placeholder="Search selected fields..." 
                                    value={selectedFieldSearchTerm} 
                                    onchange={handleSelectedFieldSearchChange}
                                    class="search-field-input-stretched">
                                </lightning-input>
                            </div>

                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_xx-small inline-header-container">
                                <span class="slds-form-element__label slds-no-margin title-label-restored">
                                    Selected Fields for Query
                                </span>
                                <div class="custom-checkbox-row">
                                    <label class="micro-checkbox-lbl">
                                        <input type="checkbox" checked={isUnselectAllChecked} onchange={handleUnselectAllChange} class="raw-cb"/>
                                        <span>Unselect All</span>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="slds-box slds-scrollable_y" style="height: 250px; background: #fff; padding: 0;">
                                <ul class="slds-has-dividers_bottom-space">
                                    <template for:each={filteredSelectedFields} for:item="sf" for:index="idx">
                                        <li key={sf} class="slds-item slds-grid slds-grid_vertical-align-center slds-p-around_xx-small">
                                            <div class="slds-col slds-truncate slds-p-left_x-small" title={sf}>
                                                {sf}
                                            </div>
                                            <div class="slds-col_auto slds-grid">
                                                <lightning-button-icon 
                                                    icon-name="utility:up" 
                                                    variant="border-filled" 
                                                    alternative-text="Move Up"
                                                    onclick={handleMoveUp} 
                                                    data-index={idx}>
                                                </lightning-button-icon>
                                                <lightning-button-icon 
                                                    icon-name="utility:down" 
                                                    variant="border-filled" 
                                                    alternative-text="Move Down"
                                                    class="slds-m-left_x-small"
                                                    onclick={handleMoveDown} 
                                                    data-index={idx}>
                                                </lightning-button-icon>
                                                <lightning-button-icon 
                                                    icon-name="utility:close" 
                                                    variant="border-filled" 
                                                    alternative-text="Remove"
                                                    class="slds-m-left_x-small"
                                                    onclick={handleRemoveSelectedField}
                                                    data-field={sf}>
                                                </lightning-button-icon>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                                <template if:false={filteredSelectedFields}>
                                    <div class="slds-text-align_center slds-text-color_weak slds-p-top_large">
                                        No matching selected fields
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>
                </div>
            </template>

            <lightning-textarea class="slds-m-top_medium" label="Where Clause"
                placeholder="Rating = 'Hot' AND Status = 'Active'" value={whereClause}
                onchange={handleWhereChange}>
            </lightning-textarea>

            <lightning-input class="slds-m-top_medium" label="Limit (Max 50,000)" type="number" value={limitSize}
                onchange={handleLimitChange}>
            </lightning-input>
            &nbsp;&nbsp;
            <div class="slds-form-element soql-form">
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                    <label class="slds-form-element__label slds-no-margin" id="soqlLabel">
                        SOQL Query (Editable)
                    </label>
                    
                    <button 
                        class="slds-button slds-button_neutral slds-button_radius custom-oval-btn slds-m-left_small"
                        onclick={handleSaveCurrentQuery}
                        title="Save query">
                        <lightning-icon 
                            icon-name="utility:save" 
                            size="x-small" 
                            class="slds-m-right_xx-small custom-btn-icon">
                        </lightning-icon>
                        Save Query
                    </button>

                    <button 
                        class="slds-button slds-button_neutral slds-button_radius custom-oval-btn slds-m-left_xx-small"
                        onclick={handleClearEverything}
                        title="Clear query and selections">
                        <lightning-icon 
                            icon-name="utility:clear" 
                            size="x-small" 
                            class="slds-m-right_xx-small custom-btn-icon">
                        </lightning-icon>
                        Clear
                    </button>
                </div>

                <div class="slds-form-element__control control-row">
                    <lightning-textarea class="soql-editor slds-m-top_none" value={soqlText}
                        placeholder="SELECT Id FROM Account" onchange={handleSoqlChange} variant="label-hidden"
                        aria-labelledby="soqlLabel" rows="4">
                    </lightning-textarea>
                </div>
            </div>

            <div class="slds-text-body_small slds-text-color_weak">
                Supports ORDER BY, GROUP BY, HAVING, and aggregate functions (COUNT, SUM, AVG, MIN, MAX).
                Use aliases for aggregate fields for better column names.
            </div>
            <template if:true={soqlErrorMessage}>
                <div class="slds-text-color_error slds-m-top_medium">
                    {soqlErrorMessage}
                </div>
            </template>
            <template if:true={soqlWarningMessage}>
                <div class="slds-text-color_warning slds-m-top_medium">
                    <b>{soqlWarningMessage}</b>
                </div>
            </template>

            <div class="slds-m-top_medium">
                <lightning-button label="Run Query" variant="brand" onclick={runQuery} disabled={isRunDisabled}>
                </lightning-button>
            </div>

            <template if:true={hasData}>
                <div class="slds-m-top_large">
                    <lightning-input type="search" label="Search results" placeholder="Search across all columns"
                        onchange={handleGlobalSearch} class="slds-m-bottom_small">
                    </lightning-input>
                </div>

                <div class="slds-m-top_large">
                    <lightning-datatable 
                        key-field="Id" 
                        class="slds-m-top_large" 
                        data={tableData} 
                        columns={columns}
                        show-row-number-column 
                        onrowselection={handleRowSelection} 
                        selected-rows={selectedRowIds}
                        draft-values={draftValues}
                        onsave={handleSave}>
                    </lightning-datatable>
                </div>

                <div class="slds-m-top_medium slds-grid slds-grid_align-spread slds-grid_vertical-align-center">

                    <div class="slds-grid slds-gutters slds-m-right_medium">
                        <div class="slds-col_auto slds-p-right_small">
                            <lightning-button label="Copy" class="slds-p-left_small"
                                onclick={handleCopy}></lightning-button>
                        </div>

                        <div class="slds-col_auto slds-p-right_small">
                            <lightning-button label="Reset" onclick={handleReset}></lightning-button>
                        </div>

                        <div class="slds-col_auto slds-p-right_small">
                            <lightning-button-menu alternative-text="More Actions" icon-name="utility:down"
                                label="More Actions" onselect={handleMenuSelect}>
                                <lightning-menu-item label="Export" value="export"></lightning-menu-item>
                                <lightning-menu-item label="Delete" value="delete"
                                    disabled={isDeleteDisabled}></lightning-menu-item>
                                <lightning-menu-item label="Bulk Delete" value="bulkDelete"></lightning-menu-item>
                            </lightning-button-menu>
                        </div>
                    </div>

                    <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-button label="Previous" onclick={prevPage} disabled={disablePrev}></lightning-button>
                        <lightning-button class="slds-m-left_small" label="Next" onclick={nextPage}
                            disabled={disableNext}></lightning-button>
                    </div>

                    <div class="slds-text-align_right">
                        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-end">
                            <span class="slds-m-right_x-small">Records per page</span>
                            <lightning-input type="number" variant="label-hidden" min="1" max={limitSize}
                                value={pageSize} onchange={handlePageSizeChange} style="width:60px">
                            </lightning-input>
                        </div>

                        <div class="slds-text-body_medium slds-m-top_x-small">
                            Showing {startRecord}–{endRecord} of {totalRecords}
                        </div>
                    </div>

                </div>

            </template>

            <div class="slds-m-top_large slds-text-align_center slds-text-body_small slds-text-color_weak">
                <img src={iconLink} width="25" height="25" alt="Logo" class="slds-m-right_x-small" /><b>Developed By:&nbsp;
                </b>
                {developedBy}
            </div>
        </div>
    </lightning-card>

    <template if:true={showDeleteAllModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Confirm Delete All</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>This will <strong>permanently delete all records</strong> returned by the current query.</p>
                    <p class="slds-m-top_small">This action cannot be undone. Are you sure you want to continue?</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeDeleteAllModal}></lightning-button>
                    <lightning-button variant="destructive" class="slds-m-left_small" label="Delete All" onclick={confirmDeleteAll}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
